<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel — Descubra Sua Pele</title>
  <link rel="icon" href="/logo">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin">
  <section id="login" class="login" hidden>
    <form class="card form" id="login-form" novalidate>
      <img src="/logo" alt="Logo" class="hero-logo" data-fallback style="max-height:80px">
      <h1 style="font-size:2rem">Painel administrativo</h1>
      <label class="field"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span>Senha</span><input type="password" name="password" autocomplete="current-password" required></label>
      <p class="form-msg" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </section>

  <div id="shell" hidden>
    <header class="admin-top">
      <a href="/" class="brand"><img src="/logo" alt="Logo" class="brand-logo" data-fallback><span class="brand-text">Descubra Sua Pele</span></a>
      <nav class="tabs" role="tablist" aria-label="Seções do painel">
        <button role="tab" data-tab="dashboard">Painel</button>
        <button role="tab" data-tab="participants">Participantes</button>
        <button role="tab" data-tab="contacts">Contatos</button>
        <button role="tab" data-tab="notifications">WhatsApp e falhas</button>
        <button role="tab" data-tab="privacy">LGPD</button>
        <button role="tab" data-tab="links">Divulgação</button>
        <button role="tab" data-tab="settings" data-owner>Configurações</button>
        <button role="tab" data-tab="users" data-owner>Usuários</button>
        <button role="tab" data-tab="audit" data-owner>Auditoria</button>
      </nav>
      <div class="who"><span id="who"></span> <button class="btn btn-ghost" id="pw-btn" type="button">Senha</button><button class="btn btn-ghost" id="logout" type="button">Sair</button></div>
    </header>
    <main class="admin-main" id="view" tabindex="-1"></main>
  </div>
  <dialog id="dlg"><div class="dialog-body"></div></dialog>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
