# Visita o site a cada 10 minutos para que o plano gratuito do Render não "durma"
# (evita a tela preta de carregamento para quem chega pelo TikTok/Instagram).
name: Manter o site acordado

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar o site
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://descubra-sua-pele.onrender.com/saude; then
              echo " — site acordado"; exit 0
            fi
            sleep 20
          done
          echo "O site não respondeu nesta tentativa" && exit 1
